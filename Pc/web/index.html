<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haven AI</title>
    <style>
        /* ===================== RESET & BASE ===================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #020208;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
        }

        /* ===================== AWAKENING OVERLAY ===================== */
        .awakening-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1.5s ease;
        }

        .awakening-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .awakening-core {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            position: relative;
            animation: corePulse 2s ease-in-out infinite;
        }

        .awakening-core::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 20px; height: 20px;
            border-radius: 50%;
            background: #00f0ff;
            box-shadow: 0 0 60px #00f0ff, 0 0 120px #00f0ff88;
            animation: coreGrow 3s ease-out forwards;
        }

        .awakening-core::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100px; height: 100px;
            border-radius: 50%;
            border: 2px solid #00f0ff44;
            animation: ringExpand 3s ease-out forwards;
        }

        @keyframes corePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes coreGrow {
            0% { width: 5px; height: 5px; opacity: 0; }
            30% { opacity: 1; }
            100% { width: 30px; height: 30px; opacity: 1; }
        }

        @keyframes ringExpand {
            0% { width: 20px; height: 20px; opacity: 0; }
            50% { opacity: 1; }
            100% { width: 200px; height: 200px; opacity: 0; }
        }

        .awakening-text {
            margin-top: 40px;
            font-size: 14px;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #00f0ff88;
            animation: textFade 2s ease-in-out infinite alternate;
        }

        @keyframes textFade {
            from { opacity: 0.3; }
            to { opacity: 1; }
        }

        .awakening-lines {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            overflow: hidden;
        }

        .awakening-line {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, transparent, #00f0ff44, transparent);
            animation: lineSweep 3s ease-in-out infinite;
        }

        @keyframes lineSweep {
            0% { transform: translateX(-100%); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(100%); opacity: 0; }
        }

        /* ===================== ENVIRONMENT BACKGROUND ===================== */
        .environment {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
            overflow: hidden;
        }

        /* Starfield */
        .stars {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
        }

        .star {
            position: absolute;
            width: 2px; height: 2px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            from { opacity: 0.1; }
            to { opacity: var(--max-opacity); }
        }

        /* Grid floor */
        .grid-floor {
            position: absolute;
            bottom: 0; left: -50%; right: -50%;
            height: 40%;
            background:
                linear-gradient(90deg, #00f0ff11 1px, transparent 1px),
                linear-gradient(0deg, #00f0ff11 1px, transparent 1px);
            background-size: 60px 40px;
            transform: perspective(500px) rotateX(60deg);
            transform-origin: bottom;
            animation: gridScroll 20s linear infinite;
        }

        @keyframes gridScroll {
            from { background-position: 0 0; }
            to { background-position: 0 40px; }
        }

        /* Floating particles */
        .particles {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
        }

        .particle {
            position: absolute;
            width: var(--size);
            height: var(--size);
            background: radial-gradient(circle, #00f0ff88, transparent);
            border-radius: 50%;
            animation: float var(--duration) ease-in-out infinite alternate;
        }

        @keyframes float {
            from { transform: translate(0, 0); opacity: 0.2; }
            to { transform: translate(var(--dx), var(--dy)); opacity: 0.6; }
        }

        /* Scan lines */
        .scanlines {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                #00f0ff08 2px,
                #00f0ff08 4px
            );
            pointer-events: none;
            z-index: 100;
        }

        /* ===================== LAYOUT ===================== */
        .dashboard {
            display: grid;
            grid-template-columns: 320px 1fr 300px;
            grid-template-rows: 50px 1fr;
            height: 100vh;
            gap: 1px;
            position: relative;
            z-index: 1;
        }

        /* ===================== HEADER ===================== */
        .header {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #0a0a1aee, #0d1b2aee);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            border-bottom: 1px solid #00f0ff22;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo {
            width: 24px; height: 24px;
            border-radius: 50%;
            background: radial-gradient(circle, #00f0ff, #0088ff);
            box-shadow: 0 0 20px #00f0ff88;
            animation: logoPulse 3s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { box-shadow: 0 0 20px #00f0ff88; }
            50% { box-shadow: 0 0 40px #00f0ffcc; }
        }

        .header h1 {
            font-size: 16px;
            font-weight: 300;
            letter-spacing: 6px;
            color: #00f0ff;
            text-transform: uppercase;
        }

        .status-bar {
            display: flex;
            gap: 24px;
            align-items: center;
            font-size: 11px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
        }

        .status-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #333;
            transition: all 0.5s;
        }

        .status-dot.online {
            background: #00ff88;
            box-shadow: 0 0 12px #00ff88;
        }

        .status-dot.warning {
            background: #ffaa00;
            box-shadow: 0 0 12px #ffaa00;
        }

        /* ===================== LEFT PANEL — AVATAR ===================== */
        .avatar-panel {
            background: linear-gradient(180deg, #0a0a1acc, #050510cc);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-right: 1px solid #00f0ff11;
            position: relative;
            overflow: hidden;
        }

        /* Ambient glow behind avatar */
        .avatar-glow {
            position: absolute;
            width: 300px; height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, #00f0ff15, transparent 70%);
            animation: glowPulse 4s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
        }

        /* Avatar container with 3D perspective */
        .avatar-container {
            position: relative;
            width: 240px;
            height: 240px;
            margin-bottom: 24px;
            z-index: 2;
            perspective: 600px;
        }

        /* 3D Avatar face wrapper */
        .avatar-3d {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            transform-style: preserve-3d;
            animation: headFloat 8s ease-in-out infinite;
        }

        /* Very subtle idle breathing — almost imperceptible */
        @keyframes headFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
        }

        /* Avatar state: listening — subtle tilt forward */
        .avatar-3d.listening {
            animation: headListen 3s ease-in-out infinite;
        }

        @keyframes headListen {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
        }

        /* Avatar state: speaking — gentle movement */
        .avatar-3d.speaking {
            animation: headSpeak 2s ease-in-out infinite;
        }

        @keyframes headSpeak {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-2px); }
        }

        /* Avatar state: thinking — slight pause */
        .avatar-3d.thinking {
            animation: headThink 4s ease-in-out infinite;
        }

        @keyframes headThink {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
        }

        /* Real face image wrapper */
        .avatar-face-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            clip-path: circle(50%);
        }

        /* Real face image */
        .avatar-face-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            border-radius: 50%;
            display: block;
            transition: filter 0.5s ease, transform 0.3s ease;
            filter: brightness(1.05) contrast(1.05) saturate(1.1);
            clip-path: circle(50%);
        }

        /* Fallback SVG face */
        .avatar-face-fallback {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
        }

        .avatar-face-fallback svg {
            width: 100%;
            height: 100%;
        }

        /* Holographic scan overlay on the real face */
        .face-hologram-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            overflow: hidden;
            pointer-events: none;
        }

        .face-hologram-overlay::after {
            content: '';
            position: absolute;
            top: -100%; left: 0; right: 0;
            height: 200%;
            background: linear-gradient(
                180deg,
                transparent 0%,
                rgba(0, 240, 255, 0.06) 40%,
                rgba(0, 240, 255, 0.12) 50%,
                rgba(0, 240, 255, 0.06) 60%,
                transparent 100%
            );
            animation: faceHoloScan 3.5s linear infinite;
        }

        @keyframes faceHoloScan {
            from { transform: translateY(-50%); }
            to { transform: translateY(0%); }
        }

        /* State-based tint overlay for the real face */
        .face-state-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            pointer-events: none;
            transition: background 0.5s ease, box-shadow 0.5s ease;
            background: transparent;
        }

        /* Idle state — subtle cyan glow */
        .avatar-3d.idle .face-state-overlay {
            background: radial-gradient(circle, rgba(0, 240, 255, 0.05) 0%, transparent 70%);
            box-shadow: inset 0 0 30px rgba(0, 240, 255, 0.1);
        }

        /* Listening state — green tint */
        .avatar-3d.listening .face-state-overlay {
            background: radial-gradient(circle, rgba(0, 255, 136, 0.1) 0%, transparent 70%);
            box-shadow: inset 0 0 40px rgba(0, 255, 136, 0.15);
        }

        .avatar-3d.listening .avatar-face-img {
            filter: brightness(1.1) contrast(1.1) saturate(1.2) hue-rotate(20deg);
        }

        /* Speaking state — cyan glow pulse */
        .avatar-3d.speaking .face-state-overlay {
            background: radial-gradient(circle, rgba(0, 240, 255, 0.1) 0%, transparent 70%);
            box-shadow: inset 0 0 40px rgba(0, 240, 255, 0.15);
            animation: speakingOverlay 2s ease-in-out infinite alternate;
        }

        @keyframes speakingOverlay {
            0% { box-shadow: inset 0 0 20px rgba(0, 240, 255, 0.1); }
            100% { box-shadow: inset 0 0 45px rgba(0, 240, 255, 0.2); }
        }

        .avatar-3d.speaking .avatar-face-img {
            filter: brightness(1.1) contrast(1.05) saturate(1.15);
        }

        /* Thinking state — purple tint */
        .avatar-3d.thinking .face-state-overlay {
            background: radial-gradient(circle, rgba(170, 136, 255, 0.1) 0%, transparent 70%);
            box-shadow: inset 0 0 40px rgba(170, 136, 255, 0.15);
        }

        .avatar-3d.thinking .avatar-face-img {
            filter: brightness(1.05) contrast(1.05) saturate(1.0) hue-rotate(-10deg);
        }

        /* Holographic scan effect on outer container */
        .avatar-hologram {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            overflow: hidden;
            pointer-events: none;
        }

        .avatar-hologram::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(
                180deg,
                transparent 0%,
                #00f0ff11 50%,
                transparent 100%
            );
            animation: holoScan 4s linear infinite;
        }

        @keyframes holoScan {
            from { transform: translateY(-100%); }
            to { transform: translateY(100%); }
        }

        /* Face energy particles */
        .face-particles {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
        }

        .face-particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #00f0ff;
            border-radius: 50%;
            opacity: 0;
            animation: faceParticleFloat 3s ease-in-out infinite;
        }

        @keyframes faceParticleFloat {
            0% { opacity: 0; transform: translateY(0) scale(0); }
            50% { opacity: 0.8; transform: translateY(-20px) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(0); }
        }

        /* Iris glow pulse — for fallback SVG */
        .iris-glow {
            animation: irisPulse 3s ease-in-out infinite;
        }

        @keyframes irisPulse {
            0%, 100% { opacity: 0.6; r: 5; }
            50% { opacity: 1; r: 6; }
        }

        /* State-specific eye color — for fallback SVG */
        .avatar-3d.listening .iris-glow {
            fill: #00ff88;
            filter: drop-shadow(0 0 8px #00ff88);
        }

        .avatar-3d.speaking .iris-glow {
            fill: #00f0ff;
            filter: drop-shadow(0 0 12px #00f0ff);
        }

        .avatar-3d.thinking .iris-glow {
            fill: #aa88ff;
            filter: drop-shadow(0 0 10px #aa88ff);
        }

        /* Breathing ring */
        .avatar-ring {
            position: absolute;
            top: -15px; left: -15px; right: -15px; bottom: -15px;
            border-radius: 50%;
            border: 1px solid #00f0ff33;
            animation: breathe 4s ease-in-out infinite;
        }

        .avatar-ring:nth-child(2) {
            top: -25px; left: -25px; right: -25px; bottom: -25px;
            border-color: #00f0ff22;
            animation-delay: 0.5s;
        }

        .avatar-ring:nth-child(3) {
            top: -35px; left: -35px; right: -35px; bottom: -35px;
            border-color: #00f0ff11;
            animation-delay: 1s;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.03); opacity: 0.8; }
        }

        /* Neural activity arcs */
        .neural-arcs {
            position: absolute;
            top: -20px; left: -20px; right: -20px; bottom: -20px;
            z-index: -1;
        }

        .neural-arc {
            position: absolute;
            top: 50%; left: 50%;
            width: 140%; height: 140%;
            transform-origin: center;
            border: 1px solid transparent;
            border-top-color: #00f0ff44;
            border-radius: 50%;
            animation: arcRotate var(--duration) linear infinite;
        }

        @keyframes arcRotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Avatar name and status */
        .avatar-name {
            font-size: 22px;
            color: #00f0ff;
            letter-spacing: 8px;
            margin-bottom: 8px;
            text-shadow: 0 0 20px #00f0ff88;
            z-index: 2;
        }

        .avatar-status {
            font-size: 11px;
            color: #555;
            letter-spacing: 3px;
            text-transform: uppercase;
            z-index: 2;
        }

        .avatar-status.online {
            color: #00ff88;
            text-shadow: 0 0 10px #00ff8888;
        }

        /* Heartbeat indicator */
        .heartbeat {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
            z-index: 2;
        }

        .heartbeat-line {
            width: 80px;
            height: 20px;
            position: relative;
            overflow: hidden;
        }

        .heartbeat-line svg {
            position: absolute;
            top: 0;
            animation: heartbeatScroll 2s linear infinite;
        }

        @keyframes heartbeatScroll {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        .heartbeat-text {
            font-size: 10px;
            color: #444;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Voice controls */
        .voice-controls {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 2;
        }

        .mic-button {
            width: 56px; height: 56px;
            border-radius: 50%;
            border: 1px solid #00f0ff33;
            background: #0a0a1a88;
            color: #00f0ff;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .mic-button:hover {
            border-color: #00f0ff;
            box-shadow: 0 0 30px #00f0ff44;
        }

        .mic-button.active {
            border-color: #ff4444;
            background: #ff444422;
            animation: mic-pulse 1s ease-in-out infinite;
        }

        @keyframes mic-pulse {
            0%, 100% { box-shadow: 0 0 0 0 #ff444466; }
            50% { box-shadow: 0 0 0 20px #ff444400; }
        }

        .voice-label {
            font-size: 10px;
            color: #444;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ===================== CENTER — CHAT ===================== */
        .chat-panel {
            background: #020208cc;
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            position: relative;
            height: 100%;
            overflow: hidden;
        }

        .chat-messages {
            flex: 1 1 auto;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 0;
        }

        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #00f0ff33;
            border-radius: 2px;
        }

        .message {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: 4px;
            font-size: 14px;
            line-height: 1.6;
            animation: messageIn 0.4s ease;
            position: relative;
        }

        @keyframes messageIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #1a3a5c, #0d2240);
            border: 1px solid #0088ff33;
            border-bottom-right-radius: 12px;
            border-top-left-radius: 12px;
            border-bottom-left-radius: 12px;
        }

        .message.haven {
            align-self: flex-start;
            background: linear-gradient(135deg, #0a1a2a, #0d1b2a);
            border: 1px solid #00f0ff22;
            border-bottom-left-radius: 12px;
            border-top-right-radius: 12px;
            border-bottom-right-radius: 12px;
            box-shadow: 0 0 20px #00f0ff11;
        }

        .message.system {
            align-self: center;
            background: transparent;
            border: 1px solid #33333333;
            color: #555;
            font-style: italic;
            font-size: 12px;
            padding: 8px 16px;
        }

        /* Typing indicator — lives inside chat-messages so it doesn't push the input bar */
        .typing-indicator {
            align-self: flex-start;
            padding: 14px 18px;
            background: linear-gradient(135deg, #0a1a2a, #0d1b2a);
            border: 1px solid #00f0ff22;
            border-radius: 12px;
            display: none;
            box-shadow: 0 0 20px #00f0ff11;
            flex-shrink: 0;
        }

        .typing-indicator.visible {
            display: flex;
            gap: 6px;
        }

        .typing-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #00f0ff;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
            30% { transform: translateY(-10px); opacity: 1; }
        }

        /* Chat input — pinned to bottom, never hidden */
        .chat-input-area {
            padding: 16px 24px;
            background: #0a0a1acc;
            backdrop-filter: blur(10px);
            border-top: 1px solid #00f0ff11;
            display: flex;
            gap: 12px;
            flex-shrink: 0;
        }

        .chat-input {
            flex: 1;
            background: #050510;
            border: 1px solid #222;
            border-radius: 4px;
            padding: 14px 20px;
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        .chat-input:focus {
            border-color: #00f0ff;
            box-shadow: 0 0 20px #00f0ff22;
        }

        .chat-input::placeholder {
            color: #444;
            letter-spacing: 1px;
        }

        .send-button {
            width: 48px; height: 48px;
            border-radius: 4px;
            border: 1px solid #00f0ff44;
            background: #0a0a1a;
            color: #00f0ff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-button:hover {
            background: #00f0ff22;
            border-color: #00f0ff;
            box-shadow: 0 0 20px #00f0ff44;
        }

        /* ===================== RIGHT PANEL — SYSTEM ===================== */
        .system-panel {
            background: linear-gradient(180deg, #0a0a1acc, #050510cc);
            backdrop-filter: blur(5px);
            border-left: 1px solid #00f0ff11;
            padding: 20px;
            overflow-y: auto;
        }

        .system-panel::-webkit-scrollbar {
            width: 4px;
        }

        .system-panel::-webkit-scrollbar-thumb {
            background: #00f0ff33;
            border-radius: 2px;
        }

        .panel-section {
            margin-bottom: 28px;
        }

        .panel-title {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #00f0ff66;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid #00f0ff11;
        }

        /* System metrics */
        .system-metric {
            margin-bottom: 14px;
        }

        .metric-label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #666;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .metric-bar {
            height: 3px;
            background: #111;
            border-radius: 1px;
            overflow: hidden;
        }

        .metric-fill {
            height: 100%;
            background: linear-gradient(90deg, #00f0ff, #0088ff);
            border-radius: 1px;
            transition: width 0.8s ease;
            box-shadow: 0 0 10px #00f0ff44;
        }

        .metric-fill.warning {
            background: linear-gradient(90deg, #ffaa00, #ff6600);
            box-shadow: 0 0 10px #ffaa0044;
        }

        .metric-fill.danger {
            background: linear-gradient(90deg, #ff4444, #ff0000);
            box-shadow: 0 0 10px #ff444444;
        }

        /* User profile */
        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: #0a0a1a88;
            border: 1px solid #00f0ff11;
            border-radius: 4px;
        }

        .user-avatar {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00f0ff, #0088ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            color: #0a0a1a;
            flex-shrink: 0;
            box-shadow: 0 0 15px #00f0ff44;
        }

        .user-info {
            flex: 1;
            min-width: 0;
        }

        .user-name {
            font-size: 14px;
            color: #e0e0e0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-label {
            font-size: 9px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .edit-name-btn {
            width: 28px; height: 28px;
            border-radius: 4px;
            border: 1px solid #333;
            background: transparent;
            color: #666;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .edit-name-btn:hover {
            border-color: #00f0ff;
            color: #00f0ff;
        }

        /* Memory stats */
        .memory-stats {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .memory-stat {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            padding: 8px 12px;
            background: #0a0a1a88;
            border: 1px solid #00f0ff11;
            border-radius: 4px;
        }

        .memory-stat-label {
            color: #666;
            letter-spacing: 1px;
        }

        .memory-stat-value {
            color: #00f0ff;
            font-weight: 500;
        }

        /* Neural activity display */
        .neural-display {
            padding: 12px;
            background: #0a0a1a88;
            border: 1px solid #00f0ff11;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .neural-label {
            font-size: 9px;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .neural-bars {
            display: flex;
            align-items: end;
            gap: 2px;
            height: 30px;
        }

        .neural-bar {
            flex: 1;
            background: #00f0ff44;
            border-radius: 1px;
            animation: neuralPulse var(--duration) ease-in-out infinite alternate;
        }

        @keyframes neuralPulse {
            from { height: var(--min-h); }
            to { height: var(--max-h); }
        }

        /* Quick actions */
        .quick-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .action-button {
            padding: 10px 14px;
            background: #0a0a1a88;
            border: 1px solid #222;
            border-radius: 4px;
            color: #aaa;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
            letter-spacing: 1px;
        }

        .action-button:hover {
            border-color: #00f0ff;
            background: #00f0ff11;
            color: #00f0ff;
        }

        /* ===================== AUDIO PLAYER ===================== */
        .audio-player {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: #0a0a1a88;
            border: 1px solid #00f0ff11;
            border-radius: 4px;
            margin-top: 8px;
        }

        .audio-player.visible {
            display: flex;
        }

        .play-btn {
            width: 28px; height: 28px;
            border-radius: 50%;
            border: 1px solid #00f0ff;
            background: transparent;
            color: #00f0ff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .audio-label {
            font-size: 10px;
            color: #555;
            letter-spacing: 1px;
        }

        /* ===================== RESPONSIVE ===================== */
        @media (max-width: 1200px) {
            .dashboard {
                grid-template-columns: 260px 1fr 260px;
            }
        }

        @media (max-width: 900px) {
            .dashboard {
                grid-template-columns: 1fr;
                grid-template-rows: 50px auto 1fr auto;
            }
            .avatar-panel {
                flex-direction: row;
                padding: 10px 20px;
                border-right: none;
                border-bottom: 1px solid #00f0ff11;
            }
            .avatar-container {
                width: 60px; height: 60px;
                margin-bottom: 0;
                margin-right: 16px;
            }
            .avatar-name, .avatar-status, .heartbeat, .voice-controls {
                display: none;
            }
            .system-panel {
                border-left: none;
                border-top: 1px solid #00f0ff11;
                max-height: 200px;
            }
        }

        /* ===================== GAME OVERLAY ===================== */
        .game-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9000;
            align-items: center;
            justify-content: center;
        }

        .game-overlay.active {
            display: flex;
        }

        .game-container {
            background: #0a0a1a;
            border: 1px solid #00f0ff44;
            border-radius: 12px;
            width: 80%;
            max-width: 800px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px #00f0ff22;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #00f0ff33;
            background: #050510;
            border-radius: 12px 12px 0 0;
        }

        .game-header h2 {
            color: #00f0ff;
            font-size: 18px;
            margin: 0;
        }

        .game-close-btn {
            background: none;
            border: 1px solid #ff4444;
            color: #ff4444;
            font-size: 16px;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .game-close-btn:hover {
            background: #ff4444;
            color: #fff;
        }

        .game-setup {
            padding: 30px;
            text-align: center;
        }

        .game-setup h3 {
            color: #00f0ff;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            color: #888;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            background: #050510;
            border: 1px solid #00f0ff33;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #00f0ff;
        }

        .setup-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .game-btn {
            padding: 10px 20px;
            background: #00f0ff22;
            border: 1px solid #00f0ff44;
            border-radius: 6px;
            color: #00f0ff;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .game-btn:hover {
            background: #00f0ff44;
        }

        .game-btn.primary {
            background: #00f0ff44;
            border-color: #00f0ff;
        }

        .game-btn.primary:hover {
            background: #00f0ff66;
        }

        .game-play {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        .game-stats {
            display: flex;
            gap: 15px;
            padding: 10px 20px;
            background: #050510;
            border-bottom: 1px solid #00f0ff22;
            flex-wrap: wrap;
        }

        .game-stat {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            color: #888;
        }

        .game-stat-value {
            color: #00f0ff;
            font-weight: bold;
        }

        .game-story {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            font-size: 14px;
            line-height: 1.6;
            color: #e0e0e0;
            max-height: 300px;
        }

        .game-story p {
            margin-bottom: 10px;
        }

        .game-choices {
            padding: 15px 20px;
            border-top: 1px solid #00f0ff22;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .choice-btn {
            padding: 8px 15px;
            background: #00f0ff11;
            border: 1px solid #00f0ff33;
            border-radius: 6px;
            color: #e0e0e0;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .choice-btn:hover {
            background: #00f0ff33;
            border-color: #00f0ff;
        }

        .game-input-area {
            display: flex;
            gap: 10px;
            padding: 15px 20px;
            border-top: 1px solid #00f0ff22;
            background: #050510;
            border-radius: 0 0 12px 12px;
        }

        .game-input {
            flex: 1;
            padding: 10px;
            background: #0a0a1a;
            border: 1px solid #00f0ff33;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 14px;
        }

        .game-input:focus {
            outline: none;
            border-color: #00f0ff;
        }
    
        /* ===== Haven v1.3: in-code avatar — no picture file ===== */
        /* The avatar is drawn in SVG inside this file. There is no
           background image, no PNG, no checkerboard: the panel's own
           dark GUI gradient shows through behind her, so she belongs
           in the scene instead of sitting in a box. */
        .avatar-face-wrapper {
            border-radius: 0 !important;
            clip-path: none !important;
            overflow: visible !important;
            background: transparent !important;
        }
        .avatar-face-img, .avatar-face-fallback { display: none !important; }
        .face-hologram-overlay, .face-state-overlay { border-radius: 0 !important; }
        .haven-avatar-svg { width: 100%; height: 100%; display: block; overflow: visible; }
        .haven-breathe { animation: havenBreathe 4s ease-in-out infinite; transform-origin: 120px 200px; }
        @keyframes havenBreathe {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-4px) scale(1.01); }
        }
        .haven-eye { animation: havenBlink 4.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
        @keyframes havenBlink {
            0%, 92%, 100% { transform: scaleY(1); }
            94%, 96% { transform: scaleY(0.08); }
        }
        .chest-core { animation: chestPulse 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
        @keyframes chestPulse {
            0%, 100% { transform: scale(1); opacity: 0.85; }
            50% { transform: scale(1.15); opacity: 1; }
        }
        .haven-hair-streak { animation: streakGlow 3s ease-in-out infinite alternate; }
        @keyframes streakGlow { from { opacity: 0.4; } to { opacity: 1; } }
        /* Speaking: mouth opens and closes, head bobs a little faster */
        .avatar-3d.speaking #mouthOpen { animation: havenSpeakMouth 0.32s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
        @keyframes havenSpeakMouth { from { transform: scaleY(0.6); } to { transform: scaleY(3.2); } }
        .avatar-3d.speaking #mouthLine { opacity: 0.35; }
        .avatar-3d.speaking .haven-breathe { animation-duration: 2s; }
        /* Listening: lean in a touch, eyes brighter */
        .avatar-3d.listening .haven-breathe { animation-duration: 3s; }
        /* Thinking: slow breathing, mouth still */
        .avatar-3d.thinking .haven-breathe { animation-duration: 5s; }
        .avatar-3d.thinking #mouthOpen { transform: scaleY(0.4); }

    
        .haven-circuit { animation: circuitGlow 3s ease-in-out infinite alternate; }
        @keyframes circuitGlow { from { opacity: 0.55; } to { opacity: 1; } }

    
        /* Haven v1.6: free-talk + she-speaks-first toggles */
        .toggle-button {
            display: block;
            width: 100%;
            margin-top: 8px;
            padding: 7px 10px;
            font-size: 12px;
            letter-spacing: 0.5px;
            color: #7fa8b8;
            background: #0a1826;
            border: 1px solid #00f0ff33;
            border-radius: 8px;
            cursor: pointer;
        }
        .toggle-button.on {
            color: #00ff88;
            border-color: #00ff8855;
            background: #0a2a1a;
            box-shadow: 0 0 10px #00ff8833;
        }
        .voice-controls { width: 100%; max-width: 220px; }

    </style>
</head>
