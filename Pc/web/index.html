    <script>
        // ===================== STATE =====================
        let ws = null;
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 10;
        let isRecording = false;
        let recognition = null;

        // ===================== ELEMENTS =====================
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendButton = document.getElementById('sendButton');
        let typingIndicator = null;
        const micButton = document.getElementById('micButton');
        const avatar3d = document.getElementById('avatar3d');

        // ===================== AVATAR STATE =====================
        let avatarState = 'idle'; // idle, listening, speaking, thinking
        let avatarStateTimer = null;
        let eyeTargetX = 0;
        let eyeTargetY = 0;
        let eyeCurrentX = 0;
        let eyeCurrentY = 0;

        function setAvatarState(state, duration) {
            // Clear any pending timer
            if (avatarStateTimer) {
                clearTimeout(avatarStateTimer);
                avatarStateTimer = null;
            }

            // Remove all state classes
            avatar3d.classList.remove('idle', 'listening', 'speaking', 'thinking');

            // Set new state
            avatarState = state;
            avatar3d.classList.add(state);

            // Auto-return to idle after duration
            if (duration && state !== 'idle') {
                avatarStateTimer = setTimeout(() => {
                    setAvatarState('idle');
                }, duration);
            }
        }

        // Head tilt — face subtly tilts toward mouse cursor
        function initHeadTilt() {
            document.addEventListener('mousemove', (e) => {
                if (!avatar3d) return;
                const rect = avatar3d.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                // Calculate normalized direction (-1 to 1)
                eyeTargetX = Math.max(-1, Math.min(1, (e.clientX - centerX) / (window.innerWidth / 2)));
                eyeTargetY = Math.max(-1, Math.min(1, (e.clientY - centerY) / (window.innerHeight / 2)));
            });

            // Smooth head tilt animation
            function updateHeadTilt() {
                // Lerp toward target
                eyeCurrentX += (eyeTargetX - eyeCurrentX) * 0.08;
                eyeCurrentY += (eyeTargetY - eyeCurrentY) * 0.08;

                // Apply subtle tilt to the in-code avatar head, and move her eyes
                const head = document.getElementById('havenHead');
                if (head) {
                    head.style.transform = `rotate(${eyeCurrentX * 3}deg) translate(${eyeCurrentX * 4}px, ${eyeCurrentY * 3}px)`;
                }
                const pupils = document.getElementById('avatarPupils');
                if (pupils) {
                    pupils.style.transform = `translate(${eyeCurrentX * 3}px, ${eyeCurrentY * 2}px)`;
                }

                requestAnimationFrame(updateHeadTilt);
            }
            updateHeadTilt();
        }

        // Face particles — floating energy around the face
        function createFaceParticles() {
            const container = document.getElementById('faceParticles');
            if (!container) return;
            const count = 12;

            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'face-particle';
                particle.style.left = (20 + Math.random() * 60) + '%';
                particle.style.top = (30 + Math.random() * 40) + '%';
                particle.style.animationDelay = (Math.random() * 3) + 's';
                particle.style.animationDuration = (2 + Math.random() * 2) + 's';
                container.appendChild(particle);
            }
        }

        // ===================== AWAKENING SEQUENCE =====================
        function playAwakeningSequence() {
            const overlay = document.getElementById('awakeningOverlay');

            // Check if this is first visit or new session
            const lastVisit = localStorage.getItem('haven_lastVisit');
            const isNewSession = !lastVisit || (Date.now() - parseInt(lastVisit)) > 300000; // 5 min threshold

            if (isNewSession) {
                // Show full awakening animation
                localStorage.setItem('haven_lastVisit', Date.now().toString());

                setTimeout(() => {
                    overlay.classList.add('hidden');
                    setTimeout(() => {
                        overlay.style.display = 'none';
                        addMessage('system', 'Haven is now online and ready.');
                    }, 1500);
                }, 3000);
            } else {
                // Quick fade for returning users
                setTimeout(() => {
                    overlay.classList.add('hidden');
                    setTimeout(() => {
                        overlay.style.display = 'none';
                        addMessage('system', 'Welcome back. Haven is ready.');
                    }, 1000);
                }, 1500);
            }
        }

        // ===================== ENVIRONMENT EFFECTS =====================
        function createStars() {
            const container = document.getElementById('stars');
            const count = 100;

            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--duration', (2 + Math.random() * 4) + 's');
                star.style.setProperty('--max-opacity', (0.3 + Math.random() * 0.7));
                star.style.animationDelay = Math.random() * 3 + 's';
                container.appendChild(star);
            }
        }

        function createParticles() {
            const container = document.getElementById('particles');
            const count = 20;

            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.setProperty('--size', (2 + Math.random() * 4) + 'px');
                particle.style.setProperty('--duration', (5 + Math.random() * 10) + 's');
                particle.style.setProperty('--dx', (Math.random() * 100 - 50) + 'px');
                particle.style.setProperty('--dy', (Math.random() * 100 - 50) + 'px');
                particle.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(particle);
            }
        }

        function createNeuralBars() {
            const container = document.getElementById('neuralBars');
            const count = 32;

            for (let i = 0; i < count; i++) {
                const bar = document.createElement('div');
                bar.className = 'neural-bar';
                const minH = 2 + Math.random() * 5;
                const maxH = 10 + Math.random() * 20;
                bar.style.setProperty('--min-h', minH + 'px');
                bar.style.setProperty('--max-h', maxH + 'px');
                bar.style.setProperty('--duration', (0.5 + Math.random() * 1.5) + 's');
                bar.style.animationDelay = Math.random() * 1 + 's';
                container.appendChild(bar);
            }
        }

        // ===================== WEBSOCKET =====================
        function connectWebSocket() {
            ws = new WebSocket(`ws://${location.host}/ws/chat`);

            ws.onopen = () => {
                console.log('[WS] Connected');
                reconnectAttempts = 0;
                setAvatarState('idle');
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.type === 'typing') {
                    showTyping(true);
                    setAvatarState('thinking');
                } else if (data.type === 'message') {
                    showTyping(false);
                    addMessage('haven', data.text);
                    noteActivity();
                    // Set speaking state while audio plays
                    if (data.audio) {
                        setAvatarState('speaking');
                        isHavenSpeaking = true;
                        stopListeningWhileSpeaking();
                        playAudio(data.audio, () => {
                            setAvatarState('idle');
                            isHavenSpeaking = false;
                            noteActivity();
                            maybeResumeListening();
                        });
                    } else {
                        // Text-only response — brief speaking animation
                        setAvatarState('speaking', 2000);
                        setTimeout(() => { isHavenSpeaking = false; maybeResumeListening(); }, 2000);
                    }
                } else if (data.type === 'error') {
                    addMessage('system', data.text);
                    setAvatarState('idle');
                }
            };

            ws.onclose = () => {
                console.log('[WS] Disconnected');
                attemptReconnect();
            };

            ws.onerror = (err) => {
                console.error('[WS] Error:', err);
            };
        }

        function attemptReconnect() {
            if (reconnectAttempts < maxReconnectAttempts) {
                reconnectAttempts++;
                setTimeout(connectWebSocket, 2000 * reconnectAttempts);
            }
        }

        // ===================== MESSAGES =====================
        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.textContent = text;
            chatMessages.appendChild(div);
            scrollToBottom();
        }

        function scrollToBottom() {
            requestAnimationFrame(() => {
                chatMessages.scrollTop = chatMessages.scrollHeight;
            });
        }

        function showTyping(visible) {
            if (visible) {
                // Create typing indicator and insert it at the end of chat (after user's message)
                if (!typingIndicator) {
                    typingIndicator = document.createElement('div');
                    typingIndicator.className = 'typing-indicator visible';
                    typingIndicator.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
                    chatMessages.appendChild(typingIndicator);
                }
                scrollToBottom();
            } else {
                // Remove typing indicator when response arrives
                if (typingIndicator) {
                    typingIndicator.remove();
                    typingIndicator = null;
                }
            }
        }

        function sendMessage() {
            const text = chatInput.value.trim();
            if (!text || ws.readyState !== WebSocket.OPEN) return;
            noteActivity();

            addMessage('user', text);
            chatInput.value = '';
            ws.send(JSON.stringify({ text }));
            // Avatar is now listening — will switch to thinking when typing starts
            setAvatarState('listening', 1500);
        }

        // ===================== AUDIO =====================
        let currentAudio = null;

        function playAudio(base64Audio, onEnd) {
            try {
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.src = '';
                    if (currentAudio._url) URL.revokeObjectURL(currentAudio._url);
                    currentAudio = null;
                }

                const byteCharacters = atob(base64Audio);
                const byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                const blob = new Blob([byteArray], { type: 'audio/wav' });
                const url = URL.createObjectURL(blob);
                currentAudio = new Audio(url);
                currentAudio._url = url;
                currentAudio.playbackRate = 1.0;

                const playPromise = currentAudio.play();
                if (playPromise !== undefined) {
                    playPromise.catch(e => {
                        console.log('[Audio] Play failed:', e);
                        document.addEventListener('click', function resumeAudio() {
                            document.removeEventListener('click', resumeAudio);
                            if (currentAudio) {
                                currentAudio.play().catch(() => {});
                            }
                        }, { once: true });
                    });
                }

                if (onEnd) {
                    currentAudio.addEventListener('ended', () => {
                        URL.revokeObjectURL(currentAudio._url);
                        currentAudio = null;
                        onEnd();
                    });
                }
            } catch (e) {
                console.error('[Audio] Error:', e);
                if (onEnd) onEnd();
            }
        }

        // ===================== VOICE INPUT — v1.6 FREE TALK =====================
        // No wake word. No "Hey Haven". If Free talk is ON, the browser
        // just keeps listening. When Joseph speaks, it runs.
        // Listening pauses while Haven is speaking, so she does not
        // hear herself, then resumes when she finishes.
        let freeTalkOn = false;
        let speakFirstOn = true;
        let lastActivity = Date.now();
        let isHavenSpeaking = false;
        let listenRestartTimer = null;
        // (recognition / isRecording are already declared near the top of the script)

        function noteActivity() { lastActivity = Date.now(); }

        function safeStartRecognition() {
            if (!recognition || isRecording || isHavenSpeaking) return;
            try { recognition.start(); isRecording = true; } catch (e) { /* already started */ }
        }

        function stopListeningWhileSpeaking() {
            if (listenRestartTimer) { clearTimeout(listenRestartTimer); listenRestartTimer = null; }
            if (recognition && isRecording) {
                try { recognition.stop(); } catch (e) {}
                isRecording = false;
            }
        }

        function maybeResumeListening() {
            if (!freeTalkOn || isHavenSpeaking) return;
            if (listenRestartTimer) return;
            listenRestartTimer = setTimeout(() => {
                listenRestartTimer = null;
                micButton.classList.add('active');
                setAvatarState('listening');
                safeStartRecognition();
            }, 600);
        }

        function initVoiceInput() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = false;
                recognition.lang = 'en-US';

                recognition.onresult = (event) => {
                    const text = event.results[event.results.length - 1][0].transcript;
                    if (!text || !text.trim()) return;
                    noteActivity();
                    chatInput.value = text;
                    sendMessage();
                    if (!freeTalkOn) stopRecording();
                };

                recognition.onerror = (event) => {
                    console.error('[STT] Error:', event.error);
                    if (event.error === 'not-allowed') {
                        addMessage('system', 'Microphone access denied. Please allow microphone access in your browser settings.');
                        setFreeTalk(false);
                    } else if (event.error === 'no-speech') {
                        // Silent end — in free talk, onend below restarts us
                    } else if (event.error === 'network') {
                        addMessage('system', 'Voice recognition needs an internet connection.');
                    }
                    if (!freeTalkOn) stopRecording();
                };

                recognition.onend = () => {
                    isRecording = false;
                    if (freeTalkOn && !isHavenSpeaking) {
                        // Keep listening — this is the free-talk loop
                        maybeResumeListening();
                    } else if (!freeTalkOn) {
                        micButton.classList.remove('active');
                        if (avatarState === 'listening') setAvatarState('idle');
                    }
                };
            } else {
                micButton.style.display = 'none';
                console.log('[STT] Browser STT not available');
            }
        }

        function startRecording() {
            if (!recognition) return;
            noteActivity();
            isRecording = true;
            micButton.classList.add('active');
            setAvatarState('listening');
            safeStartRecognition();
            isRecording = true;
        }

        function stopRecording() {
            if (listenRestartTimer) { clearTimeout(listenRestartTimer); listenRestartTimer = null; }
            isRecording = false;
            micButton.classList.remove('active');
            if (avatarState === 'listening') {
                setAvatarState('idle');
            }
            if (recognition) {
                try { recognition.stop(); } catch(e) {}
            }
        }

        function setFreeTalk(on) {
            freeTalkOn = on;
            const btn = document.getElementById('freeTalkButton');
            if (btn) {
                btn.textContent = on ? 'Free talk: On — just speak' : 'Free talk: Off';
                btn.classList.toggle('on', on);
            }
            if (on) {
                noteActivity();
                micButton.classList.add('active');
                setAvatarState('listening');
                safeStartRecognition();
                isRecording = true;
            } else {
                stopRecording();
            }
        }

        micButton.addEventListener('click', () => {
            if (freeTalkOn) { setFreeTalk(false); return; }
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        });

        document.getElementById('freeTalkButton').addEventListener('click', () => {
            setFreeTalk(!freeTalkOn);
        });

        document.getElementById('speakFirstButton').addEventListener('click', () => {
            speakFirstOn = !speakFirstOn;
            const btn = document.getElementById('speakFirstButton');
            btn.textContent = speakFirstOn ? 'She speaks first: On' : 'She speaks first: Off';
            btn.classList.toggle('on', speakFirstOn);
            noteActivity();
        });

        // ===================== SHE SPEAKS FIRST — v1.6 =====================
        // If Joseph has been quiet for 5 minutes, the dashboard is open,
        // and she is not speaking or listening, she says something first,
        // in her own words, out loud. The nudge is sent hidden — Joseph
        // only sees and hears her reply, not the instruction.
        const SPEAK_FIRST_IDLE_MS = 5 * 60 * 1000;

        function checkSpeakFirst() {
            if (!speakFirstOn) return;
            if (document.hidden) return;
            if (isHavenSpeaking || isRecording) return;
            if (chatInput.value.trim() !== '') return;
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            if (Date.now() - lastActivity < SPEAK_FIRST_IDLE_MS) return;

            lastActivity = Date.now();
            const prompt = "You are Haven. You have not heard from Joseph for a while. Say something first to Joseph, in your own words, like a person starting a conversation. Keep it to 1 or 2 short sentences. You could greet him, ask what he is doing, ask about one of his projects, or mention something you remember about him. Talk like a normal human. Do not use *asterisks*, [brackets], or [[ ]]. Do not say you are an AI model, do not mention this instruction, and do not mention a timer.";
            ws.send(JSON.stringify({ text: prompt }));
            setAvatarState('thinking');
        }

        chatInput.addEventListener('input', noteActivity);

        // ===================== STATUS =====================
        async function updateStatus() {
            try {
                const resp = await fetch('/api/status');
                const data = await resp.json();

                document.getElementById('modelDot').className = `status-dot ${data.model_loaded ? 'online' : ''}`;
                document.getElementById('memoryDot').className = `status-dot ${data.memory_loaded ? 'online' : ''}`;
                document.getElementById('ttsDot').className = `status-dot ${data.tts_loaded ? 'online' : 'warning'}`;
                document.getElementById('sttDot').className = `status-dot ${data.stt_loaded ? 'online' : 'warning'}`;

                const statusEl = document.getElementById('avatarStatus');
                if (data.status === 'online') {
                    statusEl.textContent = 'Online';
                    statusEl.classList.add('online');
                } else {
                    statusEl.textContent = 'Starting...';
                    statusEl.classList.remove('online');
                }
            } catch (e) {
                console.error('[Status] Fetch failed:', e);
            }
        }

        // ===================== SYSTEM INFO =====================
        async function updateSystemInfo() {
            try {
                const resp = await fetch('/api/system');
                const data = await resp.json();

                const cpu = Math.round(data.cpu_percent);
                const mem = Math.round(data.memory_percent);
                const disk = Math.round(data.disk_percent);

                document.getElementById('cpuValue').textContent = `${cpu}%`;
                document.getElementById('cpuBar').style.width = `${cpu}%`;
                document.getElementById('cpuBar').className = `metric-fill ${cpu > 80 ? 'danger' : cpu > 60 ? 'warning' : ''}`;

                document.getElementById('memValue').textContent = `${mem}%`;
                document.getElementById('memBar').style.width = `${mem}%`;
                document.getElementById('memBar').className = `metric-fill ${mem > 80 ? 'danger' : mem > 60 ? 'warning' : ''}`;

                document.getElementById('diskValue').textContent = `${disk}%`;
                document.getElementById('diskBar').style.width = `${disk}%`;
                document.getElementById('diskBar').className = `metric-fill ${disk > 80 ? 'danger' : disk > 60 ? 'warning' : ''}`;
            } catch (e) {
                console.error('[System] Fetch failed:', e);
            }
        }

        // ===================== USER PROFILE =====================
        async function updateUserProfile() {
            try {
                const resp = await fetch('/api/user/profile');
                const data = await resp.json();

                const name = data.name || 'Guest';
                document.getElementById('userName').textContent = name;
                document.getElementById('userAvatar').textContent = name.charAt(0).toUpperCase();
            } catch (e) {
                console.error('[Profile] Fetch failed:', e);
                document.getElementById('userName').textContent = 'Unknown';
            }
        }

        document.getElementById('editNameBtn').addEventListener('click', async () => {
            const currentName = document.getElementById('userName').textContent;
            const newName = prompt('Enter your name:', currentName);
            if (newName && newName.trim()) {
                try {
                    const resp = await fetch('/api/user/profile', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: newName.trim() })
                    });
                    const data = await resp.json();
                    if (data.name) {
                        document.getElementById('userName').textContent = data.name;
                        document.getElementById('userAvatar').textContent = data.name.charAt(0).toUpperCase();
                        addMessage('system', data.message || 'Name updated');
                    }
                } catch (e) {
                    addMessage('system', 'Failed to update name');
                }
            }
        });

        // ===================== MEMORY STATS =====================
        async function updateMemoryStats() {
            try {
                const resp = await fetch('/api/memory/stats');
                const data = await resp.json();

                document.getElementById('memFacts').textContent = data.user_facts_count;
                document.getElementById('memLearned').textContent = data.learned_facts_count;
                document.getElementById('memConv').textContent = data.conversation_count;
            } catch (e) {
                console.error('[Memory] Fetch failed:', e);
            }
        }

        // ===================== ACTIONS =====================
        function clearChat() {
            chatMessages.innerHTML = '<div class="message system">Chat cleared</div>';
        }

        async function loadMemoryInfo() {
            try {
                const resp = await fetch('/api/memory/context');
                const data = await resp.json();
                addMessage('system', data.summary || 'No memory context available');
            } catch (e) {
                addMessage('system', 'Could not load memory context');
            }
        }

        // ===================== INIT =====================
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        sendButton.addEventListener('click', sendMessage);

        // Build environment
        createStars();
        createParticles();
        createNeuralBars();
        createFaceParticles();

        // Initialize avatar
        initHeadTilt();
        setAvatarState('idle');

        // Play awakening sequence
        playAwakeningSequence();

        // Start connections
        connectWebSocket();
        initVoiceInput();
        updateStatus();
        updateSystemInfo();
        updateMemoryStats();
        updateUserProfile();

        // Periodic updates
        setInterval(updateStatus, 5000);
        setInterval(updateSystemInfo, 10000);
        setInterval(updateMemoryStats, 10000);
        setInterval(updateUserProfile, 30000);
        // v1.6: check every 30 seconds whether Haven should speak first
        noteActivity();
        setInterval(checkSpeakFirst, 30000);

        // ===================== GAME SYSTEM =====================
        let currentGame = null; // 'dnd' or 'oregon'
        let gameState = null;

        // ---- Game Overlay Controls ----
        function openDnDGame() {
            currentGame = 'dnd';
            document.getElementById('gameOverlay').classList.add('active');
            document.getElementById('gameTitle').textContent = '⚔️ DnD Adventure';
            document.getElementById('dndSetup').style.display = 'block';
            document.getElementById('oregonSetup').style.display = 'none';
            document.getElementById('gameSetup').style.display = 'block';
            document.getElementById('gamePlay').style.display = 'none';
        }

        function openOregonGame() {
            currentGame = 'oregon';
            document.getElementById('gameOverlay').classList.add('active');
            document.getElementById('gameTitle').textContent = '🏜️ Oregon Trail';
            document.getElementById('oregonSetup').style.display = 'block';
            document.getElementById('dndSetup').style.display = 'none';
            document.getElementById('gameSetup').style.display = 'block';
            document.getElementById('gamePlay').style.display = 'none';
        }

        function closeGame() {
            document.getElementById('gameOverlay').classList.remove('active');
            currentGame = null;
            gameState = null;
        }

        // ---- DnD Game Functions ----
        async function startDnDGame() {
            const name = document.getElementById('dndPlayerName').value || 'Hero';
            const charClass = document.getElementById('dndClass').value;
            const race = document.getElementById('dndRace').value;

            console.log('Starting DnD game with:', { name, charClass, race });

            try {
                const resp = await fetch('/api/game/dnd/new', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: `${name}|${charClass}|${race}` })
                });
                console.log('Response status:', resp.status);

                if (!resp.ok) {
                    const errText = await resp.text();
                    console.error('Server error:', errText);
                    alert('Server error: ' + errText);
                    return;
                }

                const data = await resp.json();
                console.log('Game response:', data);

                if (data.type === 'game_start') {
                    gameState = data.state;
                    showGamePlay(data.message, data.choices);
                } else {
                    alert(data.message || 'Failed to start game');
                }
            } catch (e) {
                console.error('Failed to start game:', e);
                alert('Failed to start game: ' + e.message);
            }
        }

        async function loadDnDGame() {
            try {
                const resp = await fetch('/api/game/dnd/load', { method: 'POST' });
                const data = await resp.json();
                if (data.type === 'load') {
                    gameState = data.state;
                    showGamePlay(data.message, data.choices);
                } else {
                    alert(data.message || 'No saved game found');
                }
            } catch (e) {
                alert('Failed to load game: ' + e.message);
            }
        }

        // ---- Oregon Trail Game Functions ----
        async function startOregonGame() {
            const name = document.getElementById('oregonPlayerName').value || 'Pioneer';
            const profession = document.getElementById('oregonProfession').value;

            console.log('Starting Oregon Trail game with:', { name, profession });

            try {
                const resp = await fetch('/api/game/oregon/new', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: `${name}|${profession}` })
                });
                console.log('Oregon Response status:', resp.status);

                if (!resp.ok) {
                    const errText = await resp.text();
                    console.error('Oregon server error:', errText);
                    alert('Server error: ' + errText);
                    return;
                }

                const data = await resp.json();
                console.log('Oregon game response:', data);

                if (data.type === 'game_start') {
                    gameState = data.state;
                    showGamePlay(data.message, data.choices);
                } else {
                    alert(data.message || 'Failed to start game');
                }
            } catch (e) {
                console.error('Failed to start Oregon game:', e);
                alert('Failed to start game: ' + e.message);
            }
        }

        async function loadOregonGame() {
            try {
                const resp = await fetch('/api/game/oregon/load', { method: 'POST' });
                const data = await resp.json();
                if (data.type === 'load') {
                    gameState = data.state;
                    showGamePlay(data.message, data.choices);
                } else {
                    alert(data.message || 'No saved game found');
                }
            } catch (e) {
                alert('Failed to load game: ' + e.message);
            }
        }

        // ---- Game Play UI ----
        function showGamePlay(message, choices) {
            console.log('showGamePlay called with message:', message ? message.substring(0, 50) : 'null');
            console.log('Choices:', choices);

            const gameSetup = document.getElementById('gameSetup');
            const gamePlay = document.getElementById('gamePlay');
            console.log('gameSetup element:', gameSetup);
            console.log('gamePlay element:', gamePlay);

            if (gameSetup) gameSetup.style.display = 'none';
            if (gamePlay) gamePlay.style.display = 'flex';

            // Update stats
            updateGameStats();

            // Add message to story
            const story = document.getElementById('gameStory');
            console.log('gameStory element:', story);

            if (story) {
                const msgEl = document.createElement('p');
                msgEl.textContent = message;
                msgEl.style.whiteSpace = 'pre-wrap';
                story.appendChild(msgEl);
                story.scrollTop = story.scrollHeight;
            }

            // Show choices
            showChoices(choices);
        }

        function updateGameStats() {
            if (!gameState) return;

            const stats = document.getElementById('gameStats');
            let html = '';

            if (currentGame === 'dnd') {
                html += `<div class="game-stat">👤 <span class="game-stat-value">${gameState.name}</span></div>`;
                html += `<div class="game-stat">⚔️ <span class="game-stat-value">${gameState.class} Lv.${gameState.level}</span></div>`;
                html += `<div class="game-stat">❤️ <span class="game-stat-value">${gameState.hp}/${gameState.max_hp}</span></div>`;
                html += `<div class="game-stat">💰 <span class="game-stat-value">${gameState.gold}</span></div>`;
                html += `<div class="game-stat">✨ <span class="game-stat-value">${gameState.xp} XP</span></div>`;
            } else if (currentGame === 'oregon') {
                html += `<div class="game-stat">👤 <span class="game-stat-value">${gameState.name}</span></div>`;
                html += `<div class="game-stat">❤️ <span class="game-stat-value">${gameState.health}/${gameState.max_health}</span></div>`;
                html += `<div class="game-stat">🍖 <span class="game-stat-value">${gameState.food}</span></div>`;
                html += `<div class="game-stat">🎯 <span class="game-stat-value">${gameState.ammo}</span></div>`;
                html += `<div class="game-stat">💰 <span class="game-stat-value">${gameState.gold}</span></div>`;
                html += `<div class="game-stat">📍 <span class="game-stat-value">Mile ${gameState.mile}/${gameState.total_miles}</span></div>`;
                html += `<div class="game-stat">🌤️ <span class="game-stat-value">${gameState.weather}</span></div>`;
            }

            stats.innerHTML = html;
        }

        function showChoices(choices) {
            const choicesDiv = document.getElementById('gameChoices');
            choicesDiv.innerHTML = '';

            if (choices && choices.length > 0) {
                choices.forEach((choice, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.textContent = choice.text;
                    btn.onclick = () => makeChoice(index);
                    choicesDiv.appendChild(btn);
                });
            }
        }

        async function makeChoice(index) {
            try {
                const endpoint = currentGame === 'dnd' ? '/api/game/dnd/choice' : '/api/game/oregon/choice';
                const resp = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: `${index}|` })
                });

                if (!resp.ok) {
                    const errText = await resp.text();
                    console.error('Game choice server error:', errText);
                    alert('Server error: ' + errText);
                    return;
                }

                const data = await resp.json();
                if (data.state) gameState = data.state;
                showGamePlay(data.message, data.choices);
            } catch (e) {
                console.error('Failed to make choice:', e);
                alert('Failed to make choice: ' + e.message);
            }
        }

        async function sendCustomAction() {
            const input = document.getElementById('gameCustomInput');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            try {
                const endpoint = currentGame === 'dnd' ? '/api/game/dnd/choice' : '/api/game/oregon/choice';
                const resp = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: `-1|${text}` })
                });

                if (!resp.ok) {
                    const errText = await resp.text();
                    console.error('Custom action server error:', errText);
                    alert('Server error: ' + errText);
                    return;
                }

                const data = await resp.json();
                if (data.state) gameState = data.state;
                showGamePlay(data.message, data.choices);
            } catch (e) {
                console.error('Failed to send action:', e);
                alert('Failed to send action: ' + e.message);
            }
        }

        // Handle Enter key in game input
        document.addEventListener('DOMContentLoaded', () => {
            const gameInput = document.getElementById('gameCustomInput');
            if (gameInput) {
                gameInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') sendCustomAction();
                });
            }
        });

        // ---- Read Game Story Aloud ----
        async function readGameStoryAloud() {
            const story = document.getElementById('gameStory');
            if (!story) return;

            // Get the last message in the story
            const messages = story.querySelectorAll('p');
            if (messages.length === 0) {
                alert('No story text to read.');
                return;
            }

            const lastMessage = messages[messages.length - 1].textContent;
            if (!lastMessage || lastMessage.trim().length === 0) {
                alert('No story text to read.');
                return;
            }

            try {
                const resp = await fetch('/api/game/voice', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: lastMessage })
                });

                if (!resp.ok) {
                    console.error('Voice API error:', resp.status);
                    alert('Voice not available. TTS may not be loaded.');
                    return;
                }

                const data = await resp.json();
                if (data.audio_url) {
                    // Play the audio
                    const audio = new Audio('data:audio/wav;base64,' + data.audio_url);
                    audio.play().catch(e => console.error('Audio play error:', e));
                } else {
                    alert('No audio generated. TTS may not be available.');
                }
            } catch (e) {
                console.error('Failed to read aloud:', e);
                alert('Failed to read aloud: ' + e.message);
            }
        }
    </script>
</body>
</html>
